name: Worker regressions

on:
  pull_request:
    paths:
      - "blog/**"
      - "s3/**"
      - "speech-to-text/**"
      - "cf-utils/**"
      - "shared/**"
      - "tests/**"
      - "scripts/**"
      - "package*.json"
      - "eslint.config.mjs"
      - ".github/workflows/worker-regressions.yml"
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "s3/**"
      - "speech-to-text/**"
      - "cf-utils/**"
      - "shared/**"
      - "tests/**"
      - "scripts/**"
      - "package*.json"
      - "eslint.config.mjs"
      - ".github/workflows/worker-regressions.yml"

permissions:
  contents: read

jobs:
  worker-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            blog/package-lock.json
            s3/package-lock.json
            speech-to-text/package-lock.json
            cf-utils/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install locked Worker toolchains
        run: |
          for project in blog s3 speech-to-text cf-utils; do
            npm ci --prefix "$project" --no-audit --no-fund
          done
      - run: npm run lint
      - run: npm test
      - run: npm run check:builds
